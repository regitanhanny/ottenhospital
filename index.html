<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5EE">
<title>Otten Hospital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23005B5C'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F7F5EE;--card:#fff;--ink:#16292A;--mut:#5F6F6E;--line:#DDD9CB;--teal:#005B5C;--teal2:#008080;--teal3:#E3EFEE;--sand:#EFEBDD;--amb:#8A6A1F;--amb2:#F5EDD3;--red:#9B3A32;--red2:#F5E4E1;--ok:#2F6B4F;--ok2:#E0EEE5;--r:8px;--f1:'Fraunces','Iowan Old Style',Georgia,serif;--f2:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f2);color:var(--ink);background:var(--bg);min-height:100vh;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f1);font-weight:600;line-height:1.2;letter-spacing:-.005em}
h2.ttl{font-size:27px;margin:16px 0 2px;font-style:italic}
h3{font-size:18px;margin-bottom:8px}
h3.sec{margin:26px 0 6px;font-size:19px;font-style:italic;color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}
.mut{color:var(--mut)}.sm{font-size:13px}.tiny{font-size:12px;color:var(--mut)}
.center{text-align:center}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--r);font-weight:700;background:var(--teal);color:#fff;border:1px solid var(--teal);font-size:14px;text-align:center;transition:background .15s}
.btn:hover{background:#004647}
.btn.pink{background:var(--teal)}.btn.mint{background:var(--teal2);border-color:var(--teal2)}.btn.mint:hover{background:#006b6b}
.btn.but{background:#fff;color:var(--teal);border-color:var(--teal)}.btn.but:hover{background:var(--teal3)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--sand)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.block{width:100%;margin-top:6px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.pink,.card.lav{background:var(--teal3)}.card.mint{background:var(--ok2)}.card.but{background:var(--amb2)}.card.red{background:var(--red2)}
.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--teal2)}
.card h3{display:flex;align-items:center;gap:6px}
/* form */
.form{display:block}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label{font-weight:700;font-size:13px}
.field label small{font-weight:500;color:var(--mut);margin-left:6px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #C5C1B1;border-radius:6px;background:#fff}
input[type=range]{padding:0;accent-color:var(--teal);border:0;height:28px}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:-6px;margin-bottom:10px;min-height:16px}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:9px;border:1px solid #C5C1B1;border-radius:6px;background:#fff;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--teal3);border-color:var(--teal);color:var(--teal)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:7px;background:#fff;cursor:pointer;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--teal);flex:none}
.chk:has(input:checked){border-color:var(--teal2);background:var(--teal3)}
.ksec{padding:0;overflow:hidden}
.ksec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 16px;font-family:var(--f1);font-weight:600;font-size:17px;line-height:1.2}
.ksec>summary::-webkit-details-marker{display:none}
.ksec>summary::after{content:'+';margin-left:auto;font-family:var(--f2);font-weight:400;font-size:22px;color:var(--mut);line-height:1}
.ksec[open]>summary::after{content:'\2212'}
.ksec>summary small{font-family:var(--f2);font-weight:500;font-size:12px;color:var(--mut)}
.ksec .kb{padding:12px 16px 6px;border-top:1px solid var(--line)}
.kbar{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
.kgrp{border:1px solid var(--line);border-radius:6px;padding:10px 12px 2px;margin-bottom:10px;background:#FCFBF7}
.kgrp>b{display:block;font-size:13px;margin-bottom:8px;color:var(--teal)}
.kgrp .field{margin-bottom:10px}
.kgrp .field>label{font-size:12px;color:var(--mut);font-weight:600}
.pq{display:grid;grid-template-columns:30px 1fr;gap:0 10px;align-items:start}
.pq>i{font-style:italic;font-family:var(--f1);font-weight:700;font-size:20px;color:var(--teal2);padding-top:22px;text-align:center}
fieldset{border:1px solid var(--line);border-radius:6px;padding:12px 12px 2px;margin-bottom:12px;min-width:0}
legend{font-family:var(--f1);font-weight:600;padding:0 8px;color:var(--teal)}
/* badge / pill */
.badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.lav{background:var(--teal3);color:var(--teal)}.badge.butter{background:var(--amb2);color:var(--amb)}.badge.mint{background:#CFE5E3;color:var(--teal)}.badge.ok{background:var(--ok2);color:var(--ok)}.badge.pink{background:var(--sand);color:var(--mut)}.badge.red{background:var(--red);color:#fff}
.pill{display:inline-block;padding:5px 11px;border-radius:5px;font-weight:600;font-size:13px}
.pill.lav{background:var(--teal3);color:var(--teal)}.pill.mint{background:var(--ok2);color:var(--ok)}.pill.but{background:var(--amb2);color:var(--amb)}.pill.red{background:var(--red2);color:var(--red)}
.logo-m{width:30px;height:30px;flex:none}
/* landing + login */
.landing,.loginw{max-width:520px;margin:0 auto;padding:56px 18px 40px}
.logo{font-family:var(--f1);font-style:italic;font-weight:600;font-size:clamp(32px,8.5vw,46px);line-height:1.05;color:var(--teal)}
.logo em{display:block;font-family:var(--f2);font-style:normal;font-weight:600;font-size:13px;color:var(--mut);margin-top:6px}
.loginw .rule{width:44px;height:2px;background:var(--teal2);margin:14px 0 18px}
.loginw h2{font-size:21px;margin-top:6px}
.tabsw{display:flex;gap:8px;margin-bottom:14px}
.tabsw button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700}
.tabsw button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
/* shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5;background:rgba(247,245,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top))}
.brand-mini{display:flex;align-items:center;gap:9px;font-family:var(--f1);font-style:italic;font-weight:600;font-size:21px;color:var(--teal);min-width:0;flex:1}
.brand-mini .bn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-mini .bn b{font-family:var(--f2);font-style:normal;font-weight:500;font-size:.6em;color:var(--mut)}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.content{padding:4px 16px 110px;max-width:1040px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;gap:4px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:5px 0;border-radius:6px}
.tabbar button.on{color:var(--teal);background:var(--teal3)}
@media(min-width:860px){
 .side{display:flex;flex-direction:column;width:244px;padding:22px 14px;border-right:1px solid var(--line);background:#fff;position:sticky;top:0;height:100vh}
 .logo-s{display:flex;align-items:center;gap:9px;font-family:var(--f1);font-style:italic;font-weight:600;font-size:23px;color:var(--teal);margin-bottom:4px}
 .sidenav{display:flex;flex-direction:column;gap:4px;flex:1;margin-top:18px}
 .navb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;font-weight:600;text-align:left;color:var(--mut)}
 .navb:hover{background:var(--sand)}
 .navb.on{background:var(--teal3);color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
 .who{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:6px;background:var(--sand)}
 .tabbar,.top .btn{display:none}
 .content{padding:8px 28px 40px}
}
.devfoot{text-align:center;font-size:11.5px;color:var(--ink);opacity:.38;padding:18px 12px 8px}
.content .devfoot{padding-top:34px}
.hello{margin-top:8px}
.hello h2{font-size:27px;font-style:italic}
.empty{text-align:center;padding:22px 16px}
.empty h3{justify-content:center}
/* dashboard */
.dgroup{margin-top:22px}
.dgroup>h3{font-size:19px;font-style:italic;color:var(--teal);margin-bottom:2px}
.dgroup>.tiny{margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.mgrid{grid-template-columns:repeat(4,1fr)}.mgrid.c3{grid-template-columns:repeat(3,1fr)}}
.mcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;border:1px solid var(--line);border-top:3px solid var(--teal2);border-radius:var(--r);padding:12px 13px;min-height:112px;transition:border-color .15s,background .15s}
.mcard:hover{background:#FCFBF7;border-color:var(--teal2)}
.mcard.warn{border-top-color:var(--amb)}.mcard.bad{border-top-color:var(--red)}
.mcard .ml{font-size:12.5px;font-weight:600;color:var(--mut);line-height:1.3}
.mcard .mv{font-family:var(--f1);font-size:32px;font-weight:600;line-height:1.05;color:var(--teal)}
.mcard .mv small{font-family:var(--f2);font-size:12px;font-weight:600;color:var(--mut);margin-left:4px}
.mcard .ms{font-size:11.5px;color:var(--mut);margin-top:auto}
.period{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 2px}
.note{background:var(--teal3);border-left:3px solid var(--teal2);border-radius:4px;padding:9px 12px;font-size:12.5px;margin:10px 0}
.trend{width:100%;height:auto;display:block;margin:6px 0}
.trend text{font-family:var(--f2);font-size:10px;fill:var(--mut)}
.frm{font-size:12.5px;color:var(--mut);margin:6px 0}
/* visit card */
.visit{display:flex;gap:12px}
.vic{font-weight:700;font-size:15px;color:var(--teal);width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--teal3);border-radius:6px}
.vbody{flex:1;min-width:0}
.vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.poli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.poli{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;font-size:12.5px}
.poli span{font-size:15px;font-weight:700;color:var(--teal)}
.poli.on{background:var(--teal3);border-color:var(--teal)}
.ticket{text-align:center;background:var(--sand);border:1px dashed #B9B49F;border-radius:6px;padding:16px;margin:12px 0}
.ticket .no{font-family:var(--f1);font-size:46px;font-weight:600;letter-spacing:2px;color:var(--teal)}
/* detail */
.pat-head{display:flex;gap:12px;align-items:flex-start}
.av{font-family:var(--f1);font-style:italic;font-weight:600;font-size:22px;width:48px;height:48px;border-radius:6px;background:var(--teal3);color:var(--teal);display:grid;place-items:center;flex:none}
.alergi{background:var(--red2);border-left:3px solid var(--red);border-radius:4px;padding:8px 12px;font-weight:700;color:var(--red);margin-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
.tbl th{font-weight:700;font-size:12px;color:var(--mut);padding:7px 5px;text-align:center;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 5px;text-align:center;border-top:1px solid var(--line);font-weight:500}
.tbl td.w{background:var(--red2);color:var(--red);font-weight:700}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl.l td,.tbl.l th{text-align:left}
.sparks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#fff}
.stat b{font-family:var(--f1);font-size:28px;display:block;line-height:1;color:var(--teal)}
.stat span{font-size:12px;font-weight:600;color:var(--mut)}
.spark{width:100%;height:auto;display:block}
.calc{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.face{font-size:34px;text-align:center}
.pain{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:4px 0 8px}
@media(min-width:560px){.pain{grid-template-columns:repeat(11,1fr)}}
.pain label{cursor:pointer}
.pain input{display:none}
.pain span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:11px;font-weight:700;color:var(--mut)}
.pain span i{font-style:normal;font-size:22px;line-height:1.1}
.pain input:checked+span{background:var(--teal3);border-color:var(--teal);color:var(--teal)}
.pes{border-left:3px solid var(--teal2);padding:4px 0 4px 12px;margin:12px 0}
.pes b{font-family:var(--f1)}
.pes ul{margin:4px 0 0 18px}
.rec{border:1px solid var(--line);border-radius:6px;background:#FCFBF7;padding:10px 12px;margin:8px 0}
.rec b{color:var(--teal)}
.rec ul{margin:4px 0 0 18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--mut);font-weight:600}.kv dd{margin:0;font-weight:600;word-break:break-word}
.soap p{margin:3px 0}
.soap b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--teal);color:#fff;font-size:12px;margin-right:6px}
.mar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.mar:first-of-type{border-top:0}
.bar{height:12px;background:var(--teal3);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal2)}
.sbar p{margin:0 0 8px}
.sbar b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--teal);color:#fff;margin-right:8px;font-family:var(--f1)}
/* beds + patients */
.beds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.beds{grid-template-columns:repeat(4,1fr)}}
.bed{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px dashed #B9B49F;border-radius:var(--r);padding:11px;min-height:108px;background:#fff}
.bed.occ{border:1px solid var(--teal2);background:var(--teal3)}
.bed.alert{background:var(--red2);border-color:var(--red)}
.bed .bn{font-weight:700;font-size:12px;color:var(--mut)}
.bed .pn{font-weight:700;line-height:1.2}
.plist .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.plist .row:first-child{border-top:0}
.plist .row .rmain{min-width:0;flex:1}
.plist .row .chev{font-size:20px;color:var(--mut);flex:none}
.search{margin:10px 0}
.casegrp{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:10px 0;overflow:hidden}
.casegrp>header{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;background:var(--sand);font-weight:700}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
.ov{position:absolute;inset:0;background:rgba(22,41,42,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-top:3px solid var(--teal);border-radius:12px 12px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom))}
.sheet .x{position:absolute;right:12px;top:12px}
.sheet h3{padding-right:70px;font-size:21px}
@media(min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:600px;border-radius:10px;max-height:88vh}}
pre.json{background:var(--ink);color:#DCE3E2;padding:14px;border-radius:6px;overflow:auto;font-size:12px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:10px 0;max-height:52vh}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-weight:600;z-index:99;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:13.5px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--sand);padding:1px 6px;border-radius:4px}
.sync{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.sync.off::before{background:var(--red)}.sync.sav::before{background:var(--amb)}
@media(max-width:560px){.sync{font-size:0;padding:5px 7px}.sync::before{margin-right:0}.top{padding-left:12px;padding-right:12px}}
.by{font-weight:500;font-size:12px;color:var(--mut)}
.evals{margin-top:6px}.evl{margin-top:6px}
.evform{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.evform select{width:auto;flex:none;padding:7px 10px}
.evform input{flex:1;min-width:150px;padding:7px 12px}
.dh{font-size:12.5px;font-weight:700;color:var(--teal);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.dsec{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:#fff}

const sdkiBy=k=>SDKI.find(x=>x.k===k);
/* rekomendasi diagnosis dari data pengkajian dan TTV (bersifat saran, keputusan tetap pada perawat) */
function recDx(e){
 const k=e.pengkajian||{},mu=e.mutu||{},t=lastTTV(e),r=[],has=new Set(e.askep.map(a=>a.sdki.k));
 const add=(kode,why)=>{if(!has.has(kode)&&!r.some(x=>x.k===kode))r.push({k:kode,why})};
 if(k.nyeri!=null&&k.nyeri!==''&&+k.nyeri>=1)add('D.0077',`Skala nyeri ${k.nyeri}/10`);
 if(k.morse){const ms=morseTotal(k.morse);if(ms>=25)add('D.0143',`Skor Morse ${ms}`)}
 const brs=fullSum(BRADEN,k.braden);if(brs!=null&&brs<=18)add('D.0139',`Skor Braden ${brs}`);
 const bts=fullSum(BARTHEL,k.barthel);if(bts!=null&&bts<100)add('D.0109',`Skor Barthel ${bts}/100`);
 const cm=(k.psiko||{}).cemas;if(cm&&cm!=='Tidak cemas')add('D.0080',`Tingkat kecemasan: ${cm.toLowerCase()}`);
 if(mu.pengetahuanPre!=null&&mu.pengetahuanPre!==''&&+mu.pengetahuanPre<70)add('D.0111',`Skor pengetahuan awal ${mu.pengetahuanPre}`);
 const bm=bmiInfo(k.bb,k.tb);if(bm&&+bm.v<18.5)add('D.0019',`IMT ${bm.v} (kurus)`);
 if(t){
  if(t.spo2<95)add('D.0003',`SpO\u2082 ${t.spo2}%`);
  if(t.rr>20||t.rr<12)add('D.0005',`RR ${t.rr}x/menit`);
  if(t.suhu>37.5)add('D.0130',`Suhu ${t.suhu}\u00B0C`);
 }
 if(+mu.phlebitis>=1)add('D.0142',`Skor phlebitis ${mu.phlebitis}`);
 if(mu.restrainTerpasang)add('D.0136','Restrain terpasang');
 return r.map(x=>({...x,d:sdkiBy(x.k)})).filter(x=>x.d);
}

/* =========================================================
   FIREBASE — Auth + Firestore
   Pola sinkronisasi: kode aplikasi tetap mengubah objek di S lalu
   memanggil save(). save() membandingkan dengan salinan terakhir dan
   hanya menulis field yang berubah (setDoc untuk dokumen baru,
   updateDoc untuk yang sudah ada). onSnapshot mengisi S dari server.
   ========================================================= */
const PROTECT=new Set(['id','createdAt','createdBy','createdByUid','updatedAt','updatedBy','updatedByUid']);
const flatten=o=>{const r={};for(const k of Object.keys(o)){if(PROTECT.has(k))continue;const j=JSON.stringify(o[k]);if(j!==undefined)r[k]=j}return r};
const clean=o=>JSON.parse(JSON.stringify(Object.fromEntries(Object.entries(o).filter(([k])=>!PROTECT.has(k)))));

function syncHTML(){const off=!navigator.onLine;const tx=off?'Offline':PENDING?'Menyimpan…':'Tersinkron';return `<span id="syncpill" class="sync${off?' off':PENDING?' sav':''}" title="${tx}" aria-label="${tx}">${tx}</span>`}
function setSync(){const el=document.getElementById('syncpill');if(!el)return;el.outerHTML=syncHTML()}
function track(p){PENDING++;setSync();const done=()=>{PENDING--;setSync()};p.then(done,done);return p}
function writeFail(name,id,prev){return err=>{console.error(err);if(prev)LAST[name].set(id,prev);else LAST[name].delete(id);toast('Gagal menyimpan ke server ('+((err&&err.code)||'periksa koneksi')+'). Simpan ulang.')}}

function syncCollection(name){
 const last=LAST[name];
 for(const o of S[name]){
  const cur=flatten(o),prev=last.get(o.id),ref=FB.doc(db,name,o.id);
  if(!prev){
   last.set(o.id,cur);
   o.createdBy=o.createdBy||ME.nama;o.createdByUid=o.createdByUid||ME.uid;o.createdAt=o.createdAt||Date.now();
   o.updatedBy=ME.nama;o.updatedAt=Date.now();
   track(FB.setDoc(ref,{...clean(o),createdAt:FB.serverTimestamp(),createdBy:o.createdBy,createdByUid:o.createdByUid,updatedAt:FB.serverTimestamp(),updatedBy:ME.nama,updatedByUid:ME.uid})).catch(writeFail(name,o.id,null));
  }else{
   const diff={};
   for(const k of Object.keys(cur))if(prev[k]!==cur[k])diff[k]=JSON.parse(cur[k]);
   for(const k of Object.keys(prev))if(!(k in cur))diff[k]=FB.deleteField();
   if(!Object.keys(diff).length)continue;
   last.set(o.id,cur);o.updatedBy=ME.nama;o.updatedAt=Date.now();
   track(FB.updateDoc(ref,{...diff,updatedAt:FB.serverTimestamp(),updatedBy:ME.nama,updatedByUid:ME.uid})).catch(writeFail(name,o.id,prev));
  }
 }
}

function fromDoc(d){
 const x=d.data({serverTimestamps:'estimate'}),o={id:d.id};
 for(const k in x){const v=x[k];o[k]=(v&&typeof v.toMillis==='function')?v.toMillis():v}
 return o;
}
function applySnap(name,snap){
 const list=S[name];let changed=false;
 snap.docChanges().forEach(ch=>{
  const id=ch.doc.id,i=list.findIndex(x=>x.id===id);
  if(ch.type==='removed'){if(i>=0){list.splice(i,1);changed=true}LAST[name].delete(id);return}
  if(ch.doc.metadata.hasPendingWrites&&i>=0)return;      // tulisan kita sendiri, S sudah yang terbaru
  const raw=fromDoc(ch.doc),o=name==='encounters'?E(raw):Object.assign({kontak:{nama:'',hub:'',hp:''}},raw);
  if(i>=0)list[i]=o;else list.push(o);
  LAST[name].set(id,flatten(o));changed=true;
 });
 const first=!READY[name];READY[name]=true;
 if(name==='patients')list.sort(byMrn);
 if(changed||first)softRender();
}

  const [a,au,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  FB={...au,...fs};
  const app=a.initializeApp(firebaseConfig);
  auth=au.getAuth(app);
  try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}   // cache offline
  catch(e){db=fs.getFirestore(app)}

const N=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};

const sum=(l,f)=>l.reduce((a,x)=>a+f(x),0);
const fx=(v,d)=>v==null||isNaN(v)?'\u2013':v.toFixed(d).replace('.',',');
const per1000=(n,h)=>h?n/h*1000:null;
const OUT_L={inpatient:'Rawat inap',discharge:'Pulang (discharge)',mati48a:'Meninggal <48 jam',mati48b:'Meninggal >48 jam'};
const KMD={mandiri:'Mandiri',parsial:'Parsial',total:'Total'};
const outcomeOf=e=>e.cls!=='IMP'?null:(e.outcome||(e.status==='finished'?'discharge':'inpatient'));
const dpDone=e=>DISCH.filter((_,i)=>e.discharge&&e.discharge[i]).length;
const dpComplete=e=>dpDone(e)===DISCH.length;
const obatN=e=>mu(e).jmlObat!=null?mu(e).jmlObat:e.mar.filter(m=>m.given).length;
const los=e=>Math.max(1,N(e.dischargeAt)-N(e.admitAt));
const completeness=e=>(e.pengkajian?3:0)+e.askep.length+e.cppt.length+e.ttv.length+Object.keys(mu(e)).length;
/* Rekam dengan nomor kasus yang sama dihitung sebagai 1 pasien/bed. Rekam acuan = yang paling lengkap, bila sama maka yang paling awal masuk. */
function uniqueEnc(list){
 const best=new Map(),out=[];
 for(const e of list){
  if(!e.kasus){out.push(e);continue}
  const k=String(e.kasus),b=best.get(k);
  if(!b){best.set(k,e);continue}
  const ce=completeness(e),cb=completeness(b);
  if(ce>cb||(ce===cb&&(e.admitAt||e.tanggal)<(b.admitAt||b.tanggal)))best.set(k,e);
 }
 return out.concat([...best.values()]);
}
function ctx(a,b){
 const U=uniqueEnc(S.encounters).filter(e=>e.cls==='IMP'&&e.admitAt);
 const aN=N(a),bN=N(b),T=N(today()),P=[],D=[],hrOf=new Map();let hr=0;
 for(const e of U){
  const s=N(e.admitAt),oc=outcomeOf(e),done=oc!=='inpatient'&&e.dischargeAt;
  const o=done?Math.max(N(e.dischargeAt),s+1):T+1;
  const d=Math.max(0,Math.min(o,bN+1)-Math.max(s,aN));
  if(d>0){P.push(e);hrOf.set(e.id,d);hr+=d}
  if(done){const n=N(e.dischargeAt);if(n>=aN&&n<=bN)D.push(e)}
 }
 return{a,b,days:bN-aN+1,beds:BEDS.length,P,D,hr,hrOf};
}

 const out=[],now=new Date();
 for(let i=n-1;i>=0;i--){const s=new Date(now.getFullYear(),now.getMonth()-i,1),en=i===0?now:new Date(now.getFullYear(),now.getMonth()-i+1,0);out.push([s.toLocaleDateString('id-ID',{month:'short'}),isoDate(s),isoDate(en)])}

}
function trendSvg(vals,labs,d){
 const nums=vals.filter(v=>v!=null);
 if(!nums.length)return '<p class="mut sm">Belum ada data historis untuk metrik ini.</p>';
 const w=360,h=140,pl=8,pr=8,pt=18,pb=22,n=vals.length,mx=Math.max(...nums),mn=Math.min(0,...nums),rg=(mx-mn)||1;
 const X=i=>pl+(n>1?i*(w-pl-pr)/(n-1):(w-pl-pr)/2),Y=v=>pt+(1-(v-mn)/rg)*(h-pt-pb);
 const pts=vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
 return `<svg class="trend" viewBox="0 0 ${w} ${h}" role="img" aria-label="Tren 12 bulan"><line x1="${pl}" y1="${Y(mn)}" x2="${w-pr}" y2="${Y(mn)}" stroke="#DDD9CB"/>`+
  `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#008080" stroke-width="2"/>`+
  vals.map((v,i)=>v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="#005B5C"/><text x="${X(i).toFixed(1)}" y="${(Y(v)-6).toFixed(1)}" text-anchor="middle">${fx(v,d)}</text>`).join('')+
  labs.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${l}</text>`).join('')+`</svg>`;
}

/* ---------- detail pasien: seluruh RME yang diinput perawat ---------- */
const optText=(opts,v,swap)=>{const f=opts.find(o=>String(swap?o[1]:o[0])===String(v));return f?(swap?f[0]:f[1]):''};
const kvRows=rows=>{const r=rows.filter(([,v])=>v!==''&&v!=null&&v!==false);return r.length?`<dl class="kv">${r.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''};
const byLine=(t,by)=>`<div class="tiny by-line">${esc(by||'—')}${t?' · '+fmtDT(t):''}</div>`;
const dsec=(title,body,open)=>`<details class="dsec"${open?' open':''}><summary>${title}</summary><div class="dbody">${body}</div></details>`;
const dh=t=>`<div class="dh">${t}</div>`;
const none=t=>`<p class="mut sm">${t}</p>`;

function kajiDetail(k){
 const g=k.gcs||{},pq=k.pqrst||{},rw=k.riwayat||{},fs=k.fisik||{},ad=k.adl||{},bt=k.barthel||{},br=k.braden||{},ps=k.psiko||{},m=k.morse||{};
 const gt=gcsTotal(g),bmi=bmiInfo(k.bb,k.tb),bts=fullSum(BARTHEL,bt),brs=fullSum(BRADEN,br),ms=morseTotal(m);
 let h=byLine(k.t,k.by);
 h+=dh('Keluhan utama & PQRST')+kvRows([['Keluhan utama',k.keluhanUtama],['Riwayat sekarang',k.rps],['P · Provokatif',pq.p],['Q · Quality',pq.q],['R · Region',k.lokasiNyeri],['S · Severity',k.nyeri!=null&&k.nyeri!==''?`${k.nyeri}/10 · ${nyeriLabel(+k.nyeri)}`:''],['T · Time',pq.t]]);
 h+=dh('Riwayat kesehatan')+kvRows(KAJI_RIWAYAT.map(([key,lab])=>[lab,rw[key]]));
 h+=dh('Kesadaran & antropometri')+kvRows([['Keadaan umum',k.keadaanUmum],['Kesadaran',k.kesadaran],['GCS',g.e?`E${g.e} M${g.m} V${g.v} = ${gt} · ${gcsLabel(gt)}`:''],['BB / TB',(k.bb||k.tb)?`${k.bb||'-'} kg / ${k.tb||'-'} cm`:''],['IMT',bmi?`${bmi.v} · ${bmi.l}`:''],['Alergi',k.alergi]]);
 h+=dh('Pemeriksaan fisik head to toe')+(KAJI_FISIK.some(([key])=>fs[key])?kvRows(KAJI_FISIK.map(([key,lab])=>[lab,fs[key]])):none('Belum diisi.'));
 h+=dh('Pola aktivitas sehari-hari')+(KAJI_ADL.some(([key])=>(ad[key]||{}).b||(ad[key]||{}).s)?kvRows(KAJI_ADL.map(([key,lab])=>{const x=ad[key]||{};return[lab,(x.b||x.s)?`Sebelum sakit: ${x.b||'-'} | Saat sakit: ${x.s||'-'}`:'']})):none('Belum diisi.'));
 h+=dh('Kemandirian ADL (Barthel)')+kvRows([['Skor',bts!=null?`${bts}/100 · ${barthelLabel(bts)[0]}`:''],...BARTHEL.map(([key,lab,o])=>[lab,optText(o,bt[key])])]);
 h+=dh('Psikososial & spiritual')+kvRows([...PSIKO_SEL.map(([key,lab])=>[lab,ps[key]]),...PSIKO_TXT.map(([key,lab])=>[lab,ps[key]])]);
 if(k.morse)h+=dh('Risiko jatuh (Morse)')+kvRows([['Skor',`${ms} · ${morseLabel(ms)[0]}`],...MORSE.map(([key,lab,o])=>[lab,optText(o,m[key],true)])]);
 h+=dh('Risiko dekubitus (Braden)')+kvRows([['Skor',brs!=null?`${brs}/23 · ${bradenLabel(brs)[0]}`:''],...BRADEN.map(([key,lab,o])=>[lab,optText(o,br[key])])]);
 if(k.catatan)h+=dh('Catatan')+kvRows([['Catatan',k.catatan]]);
 return h;
}
function askepDetail(e){
 if(!e.askep.length)return none('Belum ada diagnosis keperawatan.');
 return e.askep.map(a=>`<div class="pes"><b>${esc(a.sdki.n)}</b> <span class="tiny">${esc(a.sdki.k)}</span>
  <div class="sm">${a.risk?'dibuktikan dengan faktor risiko':'berhubungan dengan'} <b>${esc(a.etiologi)}</b>${!a.risk&&a.gejala?`, dibuktikan dengan <b>${esc(a.gejala)}</b>`:''}</div>
  <div class="sm mut" style="margin-top:4px">Luaran (SLKI): ${esc(a.slki.k)} ${esc(a.slki.n)}${a.target?' — '+esc(a.target):''}</div>${(a.kh||[]).length?`<ul class="sm">${a.kh.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <div class="sm" style="margin-top:4px"><b>Intervensi (SIKI)</b></div><ul class="sm">${a.siki.map(s=>`<li>${esc(s.k)} ${esc(s.n)}</li>`).join('')}</ul>
  ${byLine(a.t,a.by)}</div>`).join('');
}
function evalDetail(e){
 const ev=e.askep.filter(a=>(a.evaluasi||[]).length);
 let h='';
 if(ev.length)h+=dh('Evaluasi per diagnosis')+ev.map(a=>`<div class="pes"><b>${esc(a.sdki.n)}</b>${a.evaluasi.map(x=>`<div class="sm" style="margin-top:6px"><span class="badge ${EVAL_C[x.status]||'lav'}">${esc(x.status)}</span> ${esc(x.catatan)}${byLine(x.t,x.by)}</div>`).join('')}</div>`).join('');
 h+=dh('CPPT (SOAP)')+(e.cppt.length?[...e.cppt].reverse().map(c=>`<div class="soap" style="margin-bottom:10px"><p><b>S</b>${esc(c.s)||'-'}</p><p><b>O</b>${esc(c.o)||'-'}</p><p><b>A</b>${esc(c.a)||'-'}</p><p><b>P</b>${esc(c.p)||'-'}</p>${byLine(c.t,c.by)}</div>`).join(''):none('Belum ada CPPT.'));
 return h;
}
function ttvDetail(e){
 if(!e.ttv.length)return none('Belum ada TTV.');
 return `<div class="scroll-x"><table class="tbl"><thead><tr><th>Waktu</th><th>TD</th><th>N</th><th>RR</th><th>S</th><th>SpO₂</th><th>Oleh</th></tr></thead><tbody>${[...e.ttv].reverse().map(x=>`<tr><td>${fmtDT(x.t)}</td><td class="${isWarn('sis',x.sis)||isWarn('dia',x.dia)?'w':''}">${x.sis}/${x.dia}</td><td class="${isWarn('nadi',x.nadi)?'w':''}">${x.nadi}</td><td class="${isWarn('rr',x.rr)?'w':''}">${x.rr}</td><td class="${isWarn('suhu',x.suhu)?'w':''}">${x.suhu}</td><td class="${isWarn('spo2',x.spo2)?'w':''}">${x.spo2}</td><td style="text-align:left;font-size:12px">${esc(x.by||'-')}</td></tr>`).join('')}</tbody></table></div>`;
}
function inpatientDetail(e){
 const io=[...e.io].reverse(),ck=e.discharge||{};
 let h=dsec(`Obat (${e.mar.length})`,e.mar.length?[...e.mar].sort((a,b)=>a.jam.localeCompare(b.jam)).map(m=>`<div class="mar"><div><b>${esc(m.obat)}</b> <span class="sm">${esc(m.dosis)} · ${esc(m.rute)}</span><div class="sm mut">${m.jam}${m.given?` · diberikan ${fmtDT(m.givenAt)} oleh ${esc(m.by)}`:' · belum diberikan'}${m.addedBy?` · dijadwalkan oleh ${esc(m.addedBy)}`:''}</div></div>${m.given?'<span class="badge ok">Sudah</span>':''}</div>`).join(''):none('Belum ada jadwal obat.'));
 h+=dsec(`Intake / output (${io.length})`,io.length?io.map(x=>`<div class="mar"><div><b>${x.type==='in'?'Masuk':'Keluar'} ${esc(x.label)}</b><div class="sm mut">${fmtDT(x.t)}${x.by?' · '+esc(x.by):''}</div></div><b>${x.ml} ml</b></div>`).join(''):none('Belum ada catatan.'));
 h+=dsec('Discharge planning',DISCH.map((x,i)=>`<div class="sm">${ck[i]?'Selesai':'Belum'} \u2013 ${esc(x)}</div>`).join('')+(e.dischargeAt?`<div class="sm" style="margin-top:6px"><b>Pulang:</b> ${fmtDT(e.dischargeAt)}</div>`:''));
 return h;
}
function encDetail(e,first){
 const po=POLI.find(x=>x.id===e.poli)||{nama:''},isI=e.cls==='IMP',[lbl,c]=stBadge(e);
 const head=isI?`Rawat inap · Bed ${esc(e.bed||'-')}`:`Rawat jalan · ${esc(po.nama)}`;

function spark(vals,color){
 if(vals.length<2)return '';
 const w=220,h=56,p=7,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
 const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/r*(h-2*p)]);
 return `<svg viewBox="0 0 ${w} ${h}" class="spark"><polyline points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2.5"/>`).join('')}</svg><b style="font-family:var(--f1)">${vals[vals.length-1]}</b>`;
}

/* ---------- live calculators ---------- */
function calcKaji(f){
 const g=n=>f.elements[n];
 const b=bmiInfo(+g('bb').value,+g('tb').value);
 $('#bmi').textContent=b?`IMT ${b.v} · ${b.l}`:'IMT: isi BB dan TB';
 const n=+g('nyeri').value;$('#nyeriL').textContent=`${n}/10 · ${nyeriLabel(n)}`;const na=$('#nyeriAwal');if(na)na.textContent=`${n}/10`;const kh=$('#kmdHint');if(kh){const bt=fullSum(BARTHEL,Object.fromEntries(BARTHEL.map(([k])=>[k,g('b_'+k).value])));kh.textContent=bt==null?'Lengkapi Barthel untuk saran tingkat ketergantungan.':`Saran dari skor Barthel ${bt}: ${KMD[kmdSaran(bt)]}.`}
 const gt=(+g('g_e').value)+(+g('g_m').value)+(+g('g_v').value);$('#gcsL').textContent=`GCS ${gt} · ${gcsLabel(gt)}`;
 const tot=(def,pre)=>{let t=0,miss=0;def.forEach(([k])=>{const v=g(pre+k).value;if(v==='')miss++;else t+=+v});return[t,miss]};
 const pill=(id,txt,c)=>{const el=$(id);if(!el)return;el.textContent=txt;el.className='pill '+c};
 const [bt,bm]=tot(BARTHEL,'b_');
 pill('#barthelL',bm?`Skor ${bt}/100 · ${bm} item belum diisi`:`Skor ${bt}/100 · ${barthelLabel(bt)[0]}`,bm?'lav':barthelLabel(bt)[1]);
 const [bd,bdm]=tot(BRADEN,'br_');
 pill('#bradenL',bdm?`Skor ${bd} · ${bdm} item belum diisi`:`Skor ${bd}/23 · ${bradenLabel(bd)[0]}`,bdm?'lav':bradenLabel(bd)[1]);
 const mt=MORSE.reduce((a,[k])=>a+(+g('m_'+k).value),0),ml=morseLabel(mt);
 const el=$('#morseL');el.textContent=`Skor ${mt} · ${ml[0]}`;el.className='pill '+(ml[1]==='red'?'red':ml[1]==='but'?'but':'mint');
}
const L={
 reg(el,f){
  if(el.name==='nik'){el.value=el.value.replace(/\D/g,'').slice(0,16)}
  const nik=f.elements.nik.value;$('#nikc').textContent=nik.length+'/16';
  const lahir=f.elements.lahir.value,h=$('#nikhint');
  if(nik.length===16&&lahir){
   const [y,m,d]=lahir.split('-'),dd=String(+d+(f.elements.jk.value==='P'?40:0)).padStart(2,'0'),exp=dd+m+y.slice(2);
   h.textContent=nik.slice(6,12)===exp?'NIK sesuai dengan tanggal lahir dan jenis kelamin':`Digit ke-7 sampai 12 NIK umumnya ${exp} (tanggal lahir; +40 pada tanggal lahir untuk perempuan). Periksa kembali; data tetap dapat disimpan.`;
  }else h.textContent='';
 },
 kaji(el,f){calcKaji(f)},
 askep(el,f){
  if(el.name==='q'){
   const q=el.value.toLowerCase().trim(),sl=f.elements.sdki,cur=sl.value,list=SDKI.filter(d=>!q||(d.k+' '+d.n+' '+d.kw).toLowerCase().includes(q));

 addAskep(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));

  if(d.sdki==='__manual'){
   if(!(d.m_sdkiN||'').trim())return toast('Isi nama diagnosis');
   sdki={k:(d.m_sdkiK||'').trim()||'-',n:d.m_sdkiN.trim()};slki={k:(d.m_slkiK||'').trim()||'-',n:(d.m_slkiN||'').trim()||'-'};
   siki=parseSiki(d.m_siki);kh=(d.m_kh||'').split('\n').map(x=>x.trim()).filter(Boolean);
  }else{
   const dx=sdkiBy(d.sdki);if(!dx)return toast('Pilih diagnosis terlebih dahulu');
   sdki={k:dx.k,n:dx.n};risk=!!dx.risk;slki={k:dx.slki[0],n:dx.slki[1]};
   siki=$$('input[name=siki]:checked',f).map(i=>{const [k,n]=i.value.split('|');return{k,n}}).concat(parseSiki(d.siki_x));
   kh=$$('input[name=kh]:checked',f).map(i=>i.value);
  }
  if(!siki.length)return toast('Pilih atau isi minimal satu intervensi');
  e.askep.push({id:'a'+uid(),sdki,risk,etiologi:d.etiologi.trim(),gejala:(d.gejala||'').trim(),slki,kh,target:(d.target||'').trim(),siki,evaluasi:[],...M()});

 },
 addCppt(f){
  const e=enc(UI.enc),d=Object.fromEntries(new FormData(f));
  if(!(d.s||d.o||d.a||d.p).trim())return toast('Isi minimal satu komponen SOAP');
  const m={...mu(e)},ev=[];
  if(d.cp_jatuh==='on'){m.jatuh=true;ev.push('Pasien jatuh')}
  if(d.cp_phl==='on'){m.phlebitis=Math.max(1,+m.phlebitis||0);ev.push('Phlebitis')}
  if(d.cp_dekub==='on'){m.dekubitus='rs';ev.push('Dekubitus baru')}
  if(d.cp_obat==='on'){m.kesalahanObat=(+m.kesalahanObat||0)+1;ev.push('Kesalahan obat')}
  if(d.cp_restrain==='on'){m.restrainTerpasang=true;m.cederaRestrain=true;ev.push('Cedera akibat restrain')}
  if(d.nyeriSetelah!==''&&d.nyeriSetelah!=null)m.nyeriSetelah=+d.nyeriSetelah;
  e.mutu=m;
  e.cppt.push({id:'c'+uid(),...M(),s:d.s.trim(),o:d.o.trim(),a:d.a.trim(),p:d.p.trim(),kejadian:ev});

 },

 admit(f){
